<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLACK SYSTEM - Quản Lý Tài Khoản</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.FingerprintJS) {
        FingerprintJS.load().then(fp => fp.get()).then(result => {
          window.DEVICE_ID = result.visitorId;
        });
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
</head>
<body>
  <!-- ===== MÀN HÌNH LOGIN ===== -->
  <div id="loginScreen" class="screen active">
    <div class="login-box neon-border">
      <h1 class="logo neon-text">BLACK<span>SYSTEM</span></h1>
      <p class="subtitle">Hệ thống quản lý tài khoản</p>

      <div class="login-tabs">
        <button class="ltab active" data-tab="pass">Mật khẩu</button>
        <button class="ltab" data-tab="key">Private Key</button>
      </div>

      <div id="loginPassTab" class="login-pane active">
        <label>Tên đăng nhập</label>
        <input id="loginUsername" type="text" placeholder="Nhập tên đăng nhập..." />
        <label>Mật khẩu</label>
        <input id="loginPassword" type="password" placeholder="Nhập mật khẩu..." />
        <button id="btnLoginPass" class="btn-neon full">Đăng nhập</button>
      </div>

      <div id="loginKeyTab" class="login-pane">
        <label>Private Key</label>
        <input id="loginKey" type="text" placeholder="BLACK_xxxxxxxx" />
        <button id="btnLoginKey" class="btn-neon full">Đăng nhập bằng Key</button>
      </div>

      <p id="loginMsg" class="msg"></p>
    </div>
  </div>

  <!-- ===== DASHBOARD ===== -->
  <div id="dashboardScreen" class="screen">
    <header class="topbar">
      <h2 class="logo neon-text" id="btnHomeLogo" style="cursor:pointer;">BLACK<span>SYSTEM</span></h2>
      
      <div class="user-info">
        <span id="currentUserLabel"></span>
        <span id="currentRoleBadge" class="badge"></span>
        <span id="keyTimer" class="key-timer hidden">Key: 00:00:00</span>
        
        <!-- Menu Dropdown dành cho Admin/Owner -->
        <div id="adminMenuContainer" class="dropdown hidden">
          <button id="btnAdminMenu" class="btn-neon small">⚙️ Quản Lý ▼</button>
          <div id="adminDropdown" class="dropdown-content">
            <a href="#" data-tab="create">Tạo tài khoản</a>
            <a href="#" data-tab="keys">Quản lý Key</a>
            <a href="#" data-tab="lq">Acc Liên Quân</a>
            <a href="#" data-tab="cs">Acc Chung sức</a>
            <a href="#" data-tab="log" id="menuLog">Log hệ thống</a>
          </div>
        </div>

        <button id="btnLogout" class="btn-neon small">Đăng xuất</button>
      </div>
    </header>

    <!-- KHU VỰC HIỂN THỊ NỘI DUNG -->
    <div id="dashboardContent" class="content">
      
      <!-- 1. TRANG CHỦ (Mặc định) -->
      <div id="homeContent" class="tab-pane active">
        <div class="panel-center">
          <h2 class="neon-text">Nhận Acc Cộng Đồng</h2>
          <p style="color:#8ab; margin-bottom: 20px; font-size: 0.9rem;">Bấm vào nút bên dưới để nhận ngẫu nhiên 1 tài khoản Liên Quân đang mở.</p>
          <button id="btnGetAccount" type="button" class="btn-neon big" style="pointer-events:auto; opacity:1;">
            🎁 NHẬN ACC
          </button>
          <div id="receivedAccBox" class="acc-card hidden" style="margin: 20px auto;"></div>
        </div>
      </div>

      <!-- 2. KHU VỰC QUẢN LÝ CỦA ADMIN/OWNER (Ẩn mặc định) -->
      <div id="adminContent" class="tab-pane hidden"></div>

    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
