<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLACK SYSTEM - Quản Lý Tài Khoản</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.FingerprintJS) {
        FingerprintJS.load().then(fp => fp.get()).then(result => {
          window.DEVICE_ID = result.visitorId;
        });
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
</head>
<body>
  <!-- ===== MÀN HÌNH LOGIN ===== -->
  <div id="loginScreen" class="screen active">
    <div class="login-box neon-border">
      <h1 class="logo neon-text">BLACK<span>SYSTEM</span></h1>
      <p class="subtitle">Hệ thống quản lý tài khoản</p>

      <div class="login-tabs">
        <button class="ltab active" data-tab="pass">Mật khẩu</button>
        <button class="ltab" data-tab="key">Private Key</button>
      </div>

      <div id="loginPassTab" class="login-pane active">
        <label>Tên đăng nhập</label>
        <input id="loginUsername" type="text" placeholder="Nhập tên đăng nhập..." />
        <label>Mật khẩu</label>
        <input id="loginPassword" type="password" placeholder="Nhập mật khẩu..." />
        <button id="btnLoginPass" class="btn-neon full">Đăng nhập</button>
      </div>

      <div id="loginKeyTab" class="login-pane">
        <label>Private Key</label>
        <input id="loginKey" type="text" placeholder="BLACK_xxxxxxxx" />
        <button id="btnLoginKey" class="btn-neon full">Đăng nhập bằng Key</button>
      </div>

      <p id="loginMsg" class="msg"></p>
    </div>
  </div>

  <!-- ===== DASHBOARD ===== -->
  <div id="dashboardScreen" class="screen">
    <header class="topbar">
      <h2 class="logo neon-text">BLACK<span>SYSTEM</span></h2>
      
      <div class="user-info">
        <span id="currentUserLabel"></span>
        <span id="currentRoleBadge" class="badge"></span>
        <span id="keyTimer" class="key-timer hidden">Key: 00:00:00</span>
        
        <div id="navTabs" class="nav-tabs">
          <button class="nav-btn active" id="navAccBtn">ACC</button>
          <button class="nav-btn" id="navChatBtn">Chat</button>
          <button class="nav-btn hidden" id="navAdminBtn">Quản Lí</button>
        </div>

        <button id="btnLogout" class="btn-neon small">Đăng xuất</button>
      </div>
    </header>

    <div class="content" style="max-width: 1400px; padding: 0;">
      
      <!-- 1. TAB ACC -->
      <div id="accView" class="view-pane active">
        <div class="panel-center" style="min-height: 60vh;">
          <h2 class="neon-text">Nhận Acc Cộng Đồng</h2>
          <p style="color:#8ab; margin-bottom: 20px; font-size: 0.9rem;">Bấm vào nút bên dưới để nhận ngẫu nhiên 1 tài khoản Liên Quân đang mở.</p>
          <button id="btnGetAccount" type="button" class="btn-neon big" style="pointer-events:auto; opacity:1;">
            🎁 NHẬN ACC
          </button>
          <div id="receivedAccBox" class="acc-card hidden" style="margin: 20px auto;"></div>
        </div>
      </div>

      <!-- 2. TAB CHAT -->
      <div id="chatView" class="view-pane hidden">
        
        <!-- Menu chọn Chat -->
        <div id="chatMenu" style="padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; min-height: 60vh; justify-content: center;">
          <h2 class="neon-text">Phòng Chat</h2>
          <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px;">
            <button id="btnChatGlobal" class="btn-neon big" style="flex: 1; min-width: 200px;">🌐 Chat Chung</button>
            <button id="btnJoinRoom" class="btn-neon big" style="flex: 1; min-width: 200px;">🔑 Nhập ID Phòng</button>
            <button id="btnCreateRoom" class="btn-neon big" style="flex: 1; min-width: 200px;">➕ Tạo Phòng Chat</button>
          </div>
          
          <!-- Danh sách phòng đang tham gia (nếu có) -->
          <div id="myRoomsList" style="margin-top: 30px; width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 10px;"></div>
        </div>

        <!-- Giao diện Chat (Ẩn lúc đầu) -->
        <div id="chatInterface" class="hidden" style="display: flex; flex-direction: column; height: calc(100vh - 80px);">
          <div class="chat-header" style="border-radius: 0;">
            <div>
              <span id="chatRoomName" style="font-weight: bold; color: var(--neon-cyan);">Chat</span>
              <span id="chatRoomId" style="font-size: 0.8rem; color: #8ab; margin-left: 10px;"></span>
              <span id="chatMemberCount" style="font-size: 0.8rem; color: var(--yellow); margin-left: 10px;"></span>
            </div>
            <button id="btnLeaveRoom" class="btn-neon small" style="border-color: var(--red); color: var(--red);">Thoát</button>
          </div>
          
          <div id="chatMessages" class="chat-messages" style="flex: 1; padding: 20px; overflow-y: auto;"></div>
          
          <div class="chat-input-area" style="padding: 15px; background: rgba(5,6,13,.9); border-top: 1px solid rgba(0,240,255,.2);">
            <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." style="margin: 0;" autocomplete="off" />
            <button id="chatSendBtn">Gửi</button>
          </div>
        </div>

      </div>

      <!-- 3. TRANG QUẢN LÍ -->
      <div id="adminView" class="view-pane hidden" style="padding: 24px;">
        <div id="adminSubTabs" class="main-tabs" style="margin-bottom: 20px;">
          <button class="main-tab active" data-sub="create">Tạo tài khoản</button>
          <button class="main-tab" data-sub="keys">Quản lý Key</button>
          <button class="main-tab" data-sub="lq">Acc Liên Quân</button>
          <button class="main-tab" data-sub="cs">Acc Chung sức</button>
          <button class="main-tab" id="subLogBtn" data-sub="log">Log hệ thống</button>
        </div>
        <div id="adminContent"></div>
      </div>

    </div>
  </div>

  <!-- MODAL NHẬP ID PHÒNG CHAT -->
  <div id="modalJoinRoom" class="modal-overlay hidden">
    <div class="modal-box" style="border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0,240,255,.4);">
      <h3 style="color: var(--neon-cyan);">Nhập ID phòng chat</h3>
      <input type="text" id="inputJoinRoomId" placeholder="BLACKCHAT_xxxxxx" style="margin-top: 15px; text-align: center;" />
      <div class="modal-actions">
        <button class="btn-cancel-del" id="btnCancelJoin">Hủy</button>
        <button class="btn-confirm-del" id="btnConfirmJoin" style="background: rgba(0,240,255,.15); border-color: var(--neon-cyan); color: var(--neon-cyan);">Vào Phòng</button>
      </div>
    </div>
  </div>

  <!-- MODAL TẠO PHÒNG CHAT -->
  <div id="modalCreateRoom" class="modal-overlay hidden">
    <div class="modal-box" style="border-color: var(--green); box-shadow: 0 0 20px rgba(34,197,94,.4);">
      <h3 style="color: var(--green);">Tạo phòng chat mới</h3>
      <label style="text-align: left; margin-bottom: 5px;">Tên phòng chat :</label>
      <input type="text" id="inputCreateRoomName" placeholder="vd: Anh em Liên Quân" style="margin-bottom: 20px;" />
      <div class="modal-actions">
        <button class="btn-cancel-del" id="btnCancelCreate">Hủy</button>
        <button class="btn-confirm-del" id="btnConfirmCreate" style="background: rgba(34,197,94,.15); border-color: var(--green); color: var(--green);">Tạo Phòng</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script type="module" src="js/main.js?v=11"></script>
</body>
</html>
